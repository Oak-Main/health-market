name: Deploy to Cloudflare Pages

# Autonomous deploy. Once CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as
# repository secrets, every push to a release branch runs the full pipeline
# without human involvement: verify, pull fresh CMS data, deploy.
#
# The ETL runs HERE rather than being committed, because GitHub runners have the
# outbound network access to CMS that the authoring environment did not. This is
# also what keeps premiums current: re-running the workflow after CMS publishes a
# plan year is the entire data refresh procedure.

on:
  push:
    branches:
      - main
      - "claude/aca-marketplace-subsidy-estimator-**"
  workflow_dispatch:
    inputs:
      planYear:
        description: "Plan year to build benchmark data for"
        required: false
        default: "2026"
  schedule:
    # Weekly refresh. CMS revises public use files in-year, and this keeps the
    # deployed premiums from silently drifting away from the published files.
    - cron: "0 11 * * 1"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  deploy:
    name: Build data and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build benchmark data from CMS public use files
        id: etl
        continue-on-error: true
        # The PY2026 QHP landscape is a 363MB XLSX inside a ZIP; Node 22's
        # default ~4GB heap on a 7GB runner aborts (exit 134, "Ineffective
        # mark-compacts near heap limit") ~65s into the parse. The run stays
        # green only because continue-on-error deploys the committed shards —
        # which silently starves the weekly CMS refresh (observed 2026-09-29
        # dispatch: green run, dataGenerated unchanged from 2026-09-28).
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run etl -- --plan-year=${{ github.event.inputs.planYear || '2026' }} --out=public/data

      - name: Report data status
        id: data-status
        run: |
          if [ -d public/data ] && [ -n "$(find public/data -name '*.json' -print -quit)" ]; then
            COUNT=$(find public/data -name '*.json' ! -name 'index.json' | wc -l)
            echo "::notice::Built $COUNT benchmark shards from CMS."
            echo "### Benchmark data: $COUNT shards built" >> "$GITHUB_STEP_SUMMARY"
            echo "shards_empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ETL produced no shards. Deploying anyway — the API will \
            return an honest 'dataset-not-loaded' rather than an invented premium. \
            Check whether CMS has published this plan year yet."
            echo "### Benchmark data: NONE — API will report data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "shards_empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against shipping synthetic premiums
        run: |
          if grep -rl "SYNTHETIC" public/data 2>/dev/null; then
            echo "::error::Synthetic fixture data found in the deploy artifact. Refusing to deploy."
            exit 1
          fi
          echo "No synthetic data in the artifact."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=subsidy-dropoff --branch=${{ github.ref_name }}

      # Nothing upstream of this step pages anyone on its own — a failed run
      # or an empty-shard deploy would otherwise only be visible to someone
      # who happens to check Actions. This is what makes that visible.
      - name: Alert on deploy failure or empty dataset
        if: failure() || steps.data-status.outputs.shards_empty == 'true'
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy issue: run ${{ github.run_id }} (${{ github.event_name }} on ${{ github.ref_name }})" \
            --body "Run failed or produced zero benchmark shards at $(date -u +%FT%TZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || echo "::error::Could not create an alert issue — check that GITHUB_TOKEN has issues:write for this repo."
        env:
          GH_TOKEN: ${{ github.token }}
