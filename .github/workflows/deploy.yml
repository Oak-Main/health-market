name: Deploy to Cloudflare Pages

# Autonomous deploy. Once CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as
# repository secrets, every push to a release branch runs the full pipeline
# without human involvement: verify, pull fresh CMS data, deploy.
#
# The ETL runs HERE rather than being committed, because GitHub runners have the
# outbound network access to CMS that the authoring environment did not. This is
# also what keeps premiums current: re-running the workflow after CMS publishes a
# plan year is the entire data refresh procedure.

on:
  pull_request:
  push:
    branches:
      - main
      - "claude/aca-marketplace-subsidy-estimator-**"
  workflow_dispatch:
    inputs:
      planYear:
        description: "Plan year to build benchmark data for"
        required: false
        default: "2026"
  schedule:
    # Weekly refresh. CMS revises public use files in-year, and this keeps the
    # deployed premiums from silently drifting away from the published files.
    - cron: "0 11 * * 1"

concurrency:
  group: deploy-${{ github.event_name == 'schedule' && 'refs/heads/main' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled events originate on the repository default branch. Pages serves main.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
      - name: Record the revision being verified
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - run: npm run engine:typecheck
      - run: npm run check:security-floor
      - name: Test
        run: npm test

  deploy:
    name: Build data and deploy
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build and verify fresh CMS benchmark shards
        env:
          NODE_OPTIONS: --max-old-space-size=6500
          PLAN_YEAR: ${{ github.event.inputs.planYear || '2026' }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d "$RUNNER_TEMP/benchmarks.XXXXXX")
          npm run etl -- "--plan-year=$PLAN_YEAR" "--out=$stage"
          npm run etl:verify -- "$stage" "$PLAN_YEAR"
          rm -rf -- public/data
          mv -- "$stage" public/data

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=subsidy-dropoff --branch=${{ github.event_name == 'schedule' && 'main' || github.ref_name }}

      # Nothing upstream of this step pages anyone on its own — a failed run
      # or an empty-shard deploy would otherwise only be visible to someone
      # who happens to check Actions. This is what makes that visible.
      - name: Alert on deploy failure or empty dataset
        if: failure()
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy issue: run ${{ github.run_id }} (${{ github.event_name }} on ${{ github.ref_name }})" \
            --body "Run failed or produced zero benchmark shards at $(date -u +%FT%TZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || echo "::error::Could not create an alert issue — check that GITHUB_TOKEN has issues:write for this repo."
        env:
          GH_TOKEN: ${{ github.token }}
